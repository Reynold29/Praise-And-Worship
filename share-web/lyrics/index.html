<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090d16" />
  <meta name="theme-color" content="#f6f8fd" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Worship Companion" />
  <meta name="apple-itunes-app" content="app-id=6759990066" id="appleAppBanner" />
  <meta name="description" content="Open song lyrics with Worship Companion." />
  <meta property="og:site_name" content="Worship Companion" />
  <meta property="og:type" content="music.song" />
  <meta property="og:title" content="Worship Companion — Lyrics" />
  <meta property="og:description" content="Open song lyrics with Worship Companion." />
  <meta property="og:image" content="../og-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Worship Companion — Lyrics" />
  <meta name="twitter:description" content="Open song lyrics with Worship Companion." />
  <meta name="twitter:image" content="../og-card.png" />
  <link rel="canonical" href="" />
  <link rel="manifest" href="../manifest.json" />
  <title>Worship Companion — Lyrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../shared.js"></script>
</head>
<body>
  <main class="page">
    <div class="brand-nav">
      <a href="../" class="brand-badge">
        <img src="../app_logo.png" class="brand-logo-img" alt="Worship Companion Logo" />
        <span>Worship Companion</span>
      </a>
    </div>
    <div id="openAppBanner"></div>
    <div id="content" class="status">Opening lyrics…</div>
  </main>
  <div class="download-bar"><div class="download-inner" id="storeBar"></div></div>

  <script>
    const params = new URLSearchParams(location.search);
    const lang = (params.get("l") || "english").toLowerCase();
    const id = params.get("id");
    const content = document.getElementById("content");
    const root = document.documentElement;
    const reduceMotion = prefersReducedMotion();

    setShareMeta({
      title: "Worship Companion — Lyrics",
      description: "Open song lyrics with Worship Companion.",
      url: location.href,
      type: "music.song",
    });

    storeButtons(document.getElementById("storeBar"));
    renderOpenAppBanner(document.getElementById("openAppBanner"));

    if (!id) {
      content.className = "error";
      content.textContent = "This link is missing a song id.";
    } else {
      const client = createClient();
      const table = tableForLang(lang);
      let channel;
      let autoScrollRaf = null;
      let lastScrollTimestamp = 0;
      const scrollSpeedPxSec = 45; // 45px per second gives comfortable reading pace
      let fontPx = Number(localStorage.getItem("wc_lyrics_font_px") || 17);
      let lightTheme = localStorage.getItem("wc_web_theme") === "light";
      let currentScript = "original"; // "original" | "trans"
      let currentSongData = null;

      if (!Number.isFinite(fontPx) || fontPx < 14 || fontPx > 30) {
        fontPx = 17;
      }
      root.style.setProperty("--font-size", fontPx + "px");
      if (lightTheme) {
        root.setAttribute("data-theme", "light");
      }

      function updateThemeIcon() {
        const themeBtn = document.getElementById("themeToggle");
        if (!themeBtn) return;
        if (lightTheme) {
          themeBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            <span>Dark</span>
          `;
        } else {
          themeBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/></svg>
            <span>Light</span>
          `;
        }
      }

      function stopAutoScroll() {
        if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
        autoScrollRaf = null;
        lastScrollTimestamp = 0;
        const autoBtn = document.getElementById("autoScrollToggle");
        if (autoBtn) {
          autoBtn.classList.remove("active");
          autoBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span>Auto Scroll</span>
          `;
        }
      }

      function autoScrollStep(timestamp) {
        if (!autoScrollRaf) return;
        if (!lastScrollTimestamp) lastScrollTimestamp = timestamp;
        const deltaSeconds = (timestamp - lastScrollTimestamp) / 1000;
        lastScrollTimestamp = timestamp;

        const scrollEl = document.scrollingElement || document.documentElement || document.body;
        const maxScroll = scrollEl.scrollHeight - window.innerHeight - 2;

        if (scrollEl.scrollTop >= maxScroll) {
          stopAutoScroll();
          return;
        }

        const step = Math.max(0.4, scrollSpeedPxSec * deltaSeconds);
        scrollEl.scrollTop += step;

        autoScrollRaf = requestAnimationFrame(autoScrollStep);
      }

      function toggleAutoScroll() {
        const autoBtn = document.getElementById("autoScrollToggle");
        if (autoScrollRaf) {
          stopAutoScroll();
          return;
        }
        if (reduceMotion) {
          window.scrollBy({ top: Math.max(180, window.innerHeight * 0.7), left: 0, behavior: "auto" });
          return;
        }
        autoBtn?.classList.add("active");
        if (autoBtn) {
          autoBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <span>Stop Scroll</span>
          `;
        }
        lastScrollTimestamp = 0;
        autoScrollRaf = requestAnimationFrame(autoScrollStep);
      }

      function updateFont(nextPx) {
        fontPx = Math.max(14, Math.min(30, nextPx));
        root.style.setProperty("--font-size", fontPx + "px");
        localStorage.setItem("wc_lyrics_font_px", String(fontPx));
        const indicator = document.getElementById("fontSizeLabel");
        if (indicator) indicator.textContent = fontPx;
      }

      function getDisplayedLyrics(song) {
        if (currentScript === "trans" && song.trans_lyrics && song.trans_lyrics.trim()) {
          return song.trans_lyrics;
        }
        return song.lyrics || "";
      }

      function render(song) {
        if (!song) {
          content.className = "error";
          content.textContent = "Song not found.";
          setShareMeta({
            title: "Song not found — Worship Companion",
            description: "This lyrics link could not be opened.",
            url: location.href,
            type: "music.song",
          });
          return;
        }
        currentSongData = song;

        const author = song.author_name && song.author_name !== "UNKNOWN" ? song.author_name : "";
        const title = song.title || "Untitled";
        const hasTrans = Boolean(song.trans_lyrics && song.trans_lyrics.trim());
        const hasEnglishTitle = song.english_title && song.english_title.trim() && song.english_title.trim().toLowerCase() !== title.toLowerCase();

        const descParts = [];
        if (author) descParts.push(author);
        if (song.key_signature) descParts.push("Key " + song.key_signature);
        descParts.push("Open lyrics in Worship Companion");

        content.className = "";
        content.innerHTML = `
          <div class="song-hero">
            <div class="song-badges">
              <span class="pill-badge accent">${langFullName(lang)}</span>
              ${song.key_signature ? `<span class="pill-badge key-badge">Key: ${escapeHtml(song.key_signature)}</span>` : ""}
            </div>
            <h1 class="song-title">${escapeHtml(title)}</h1>
            <div class="song-subtitle">
              ${hasEnglishTitle ? `<span>${escapeHtml(song.english_title)}</span>` : ""}
              ${hasEnglishTitle && author ? `<span>•</span>` : ""}
              ${author ? `<span>by <strong class="song-subtitle-artist">${escapeHtml(author)}</strong></span>` : ""}
            </div>
            ${hasTrans ? `
              <div class="script-toggle-wrap">
                <button type="button" class="script-toggle-btn ${currentScript === 'original' ? 'active' : ''}" id="scriptOrigBtn">Original</button>
                <button type="button" class="script-toggle-btn ${currentScript === 'trans' ? 'active' : ''}" id="scriptTransBtn">English (Transliteration)</button>
              </div>
            ` : ""}
          </div>

          <div class="toolbar">
            <div class="toolbar-group">
              <div class="font-stepper">
                <button type="button" class="btn-tool" id="fontDown" aria-label="Decrease font">A-</button>
                <span class="font-size-label" id="fontSizeLabel">${fontPx}</span>
                <button type="button" class="btn-tool" id="fontUp" aria-label="Increase font">A+</button>
              </div>
              <button type="button" class="btn-tool" id="autoScrollToggle">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>${reduceMotion ? "Scroll Down" : "Auto Scroll"}</span>
              </button>
            </div>
            <div class="toolbar-group">
              <button type="button" class="btn tonal share-qr-btn" id="shareQrBtn">
                <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-5 0h3v5h-3v-5zm2 5h3v3h-3v-3zm3-2h3v5h-3v-5z"/></svg>
                <span>Share QR</span>
              </button>
              <button type="button" class="btn tonal" id="copyLyrics">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                <span>Copy</span>
              </button>
              <button type="button" class="btn tonal" id="themeToggle" aria-label="Toggle theme">
                <span>Theme</span>
              </button>
            </div>
          </div>

          <div class="card lyrics-card" id="lyricsTextContainer">${escapeHtml(getDisplayedLyrics(song))}</div>
        `;

        setShareMeta({
          title: title + " — Worship Companion",
          description: descParts.join(" · "),
          url: location.href,
          type: "music.song",
        });
        updateThemeIcon();

        // Wire script toggle
        if (hasTrans) {
          const origBtn = document.getElementById("scriptOrigBtn");
          const transBtn = document.getElementById("scriptTransBtn");
          const lyricsBox = document.getElementById("lyricsTextContainer");

          origBtn?.addEventListener("click", () => {
            currentScript = "original";
            origBtn.classList.add("active");
            transBtn?.classList.remove("active");
            if (lyricsBox) lyricsBox.textContent = getDisplayedLyrics(song);
          });

          transBtn?.addEventListener("click", () => {
            currentScript = "trans";
            transBtn.classList.add("active");
            origBtn?.classList.remove("active");
            if (lyricsBox) lyricsBox.textContent = getDisplayedLyrics(song);
          });
        }

        // Wire font stepper
        document.getElementById("fontDown")?.addEventListener("click", () => updateFont(fontPx - 1));
        document.getElementById("fontUp")?.addEventListener("click", () => updateFont(fontPx + 1));

        // Wire auto scroll
        document.getElementById("autoScrollToggle")?.addEventListener("click", toggleAutoScroll);

        // Wire Share QR button
        document.getElementById("shareQrBtn")?.addEventListener("click", () => {
          const detailParts = [];
          if (author) detailParts.push(author);
          if (song.key_signature) detailParts.push("Key: " + song.key_signature);
          openShareQrModal({
            title: "Share Song",
            subtitle: "Anyone can scan this code to open on their phone",
            url: location.href,
            caption: song.title || "Song",
            detail: detailParts.join(" · "),
          });
        });

        // Wire Theme toggle
        document.getElementById("themeToggle")?.addEventListener("click", () => {
          lightTheme = !lightTheme;
          if (lightTheme) {
            root.setAttribute("data-theme", "light");
            localStorage.setItem("wc_web_theme", "light");
          } else {
            root.removeAttribute("data-theme");
            localStorage.setItem("wc_web_theme", "dark");
          }
          updateThemeIcon();
        });

        // Wire Copy lyrics button
        document.getElementById("copyLyrics")?.addEventListener("click", async () => {
          const text = getDisplayedLyrics(song);
          try {
            await navigator.clipboard.writeText(text);
            if (navigator.vibrate) navigator.vibrate(20);
            showToast("Lyrics copied to clipboard");
          } catch (_) {
            showToast("Could not copy lyrics");
          }
        });
      }

      async function fetchSong() {
        const { data, error } = await client
          .from(table)
          .select("id,title,english_title,author_name,key_signature,lyrics,trans_lyrics")
          .eq("id", id)
          .maybeSingle();

        if (error) {
          content.className = "error";
          content.textContent = "Could not load this song.";
          return;
        }
        render(data);
      }

      const load = debounce(fetchSong, 400);

      function startLive() {
        channel = subscribeFiltered(client, "song-" + id, table, "id=eq." + id, load);
      }

      fetchSong();
      startLive();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopAutoScroll();
          if (channel) client.removeChannel(channel);
          channel = null;
        } else {
          fetchSong();
          startLive();
        }
      });
    }
  </script>
</body>
</html>
