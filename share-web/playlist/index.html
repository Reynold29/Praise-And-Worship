<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090d16" />
  <meta name="theme-color" content="#f6f8fd" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Worship Companion" />
  <meta name="apple-itunes-app" content="app-id=6759990066" id="appleAppBanner" />
  <meta name="description" content="Open a shared playlist with Worship Companion." />
  <meta property="og:site_name" content="Worship Companion" />
  <meta property="og:type" content="music.playlist" />
  <meta property="og:title" content="Worship Companion — Playlist" />
  <meta property="og:description" content="Open a shared playlist with Worship Companion." />
  <meta property="og:image" content="../og-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Worship Companion — Playlist" />
  <meta name="twitter:description" content="Open a shared playlist with Worship Companion." />
  <meta name="twitter:image" content="../og-card.png" />
  <link rel="canonical" href="" />
  <link rel="manifest" href="../manifest.json" />
  <title>Worship Companion — Playlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../shared.js"></script>
</head>
<body>
  <main class="page">
    <div class="brand-nav">
      <a href="../" class="brand-badge">
        <img src="../app_logo.png" class="brand-logo-img" alt="Worship Companion Logo" />
        <span>Worship Companion</span>
      </a>
    </div>
    <div id="openAppBanner"></div>
    <div id="content" class="status">Opening playlist…</div>
  </main>
  <div class="download-bar"><div class="download-inner" id="storeBar"></div></div>

  <script>
    const id = new URLSearchParams(location.search).get("id");
    const content = document.getElementById("content");
    const root = document.documentElement;
    let lightTheme = localStorage.getItem("wc_web_theme") === "light";

    if (lightTheme) {
      root.setAttribute("data-theme", "light");
    }

    function updateThemeIcon() {
      const themeBtn = document.getElementById("themeToggle");
      if (!themeBtn) return;
      if (lightTheme) {
        themeBtn.innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
          <span>Dark</span>
        `;
      } else {
        themeBtn.innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/></svg>
          <span>Light</span>
        `;
      }
    }

    setShareMeta({
      title: "Worship Companion — Playlist",
      description: "Open a shared playlist with Worship Companion.",
      url: location.href,
      type: "music.playlist",
    });

    storeButtons(document.getElementById("storeBar"));
    renderOpenAppBanner(document.getElementById("openAppBanner"));

    if (!id) {
      content.className = "error";
      content.textContent = "This link is missing a playlist id.";
    } else {
      const client = createClient();
      let channels = [];
      let latestSongs = [];
      let playlistName = "Playlist";

      async function fetchSongsFor(entries) {
        const byLang = { english: [], kannada: [], other: [] };
        for (const row of entries) {
          byLang[langForCategory(row.category)].push(row.song_id);
        }
        const songsById = {};
        for (const [lang, ids] of Object.entries(byLang)) {
          if (!ids.length) continue;
          const { data } = await client
            .from(tableForLang(lang))
            .select("id,title,author_name,category")
            .in("id", ids);
          for (const song of data || []) {
            songsById[String(song.id)] = { ...song, _lang: lang };
          }
        }
        return entries.map((row) => {
          const song = songsById[String(row.song_id)];
          return {
            title: song?.title || "Song unavailable",
            author: song?.author_name || "",
            lang: song?._lang || "other",
            href: song
              ? `../lyrics/?l=${encodeURIComponent(song._lang)}&id=${encodeURIComponent(song.id)}`
              : null,
          };
        });
      }

      function songMatchesQuery(song, query) {
        if (!query) return true;
        const hay = (song.title + " " + song.author + " " + song.lang).toLowerCase();
        return hay.includes(query);
      }

      function renderList(songs, query) {
        const filtered = songs.filter((s) => songMatchesQuery(s, query));
        const list = document.getElementById("songList");
        const count = document.getElementById("songCount");
        const empty = document.getElementById("emptyFilter");
        if (!list || !count) return;

        count.textContent =
          (query ? filtered.length + " of " + songs.length : String(songs.length)) +
          " song" +
          (songs.length === 1 ? "" : "s");

        if (!filtered.length) {
          list.innerHTML = "";
          if (empty) empty.hidden = false;
          return;
        }
        if (empty) empty.hidden = true;

        list.innerHTML = filtered.map((s) => s.href
          ? `<a class="row" href="${s.href}">
              <div class="row-main">
                <strong class="row-title">${escapeHtml(s.title)}</strong>
                <span class="row-author">${escapeHtml(s.author || "Unknown artist")}</span>
              </div>
              <span class="chip">${langChip(s.lang)}</span>
            </a>`
          : `<div class="row">
              <div class="row-main">
                <strong class="row-title">${escapeHtml(s.title)}</strong>
              </div>
              <span class="chip">--</span>
            </div>`
        ).join("");
      }

      function wireSearch() {
        const input = document.getElementById("playlistSearch");
        if (!input) return;
        const onSearch = debounce(() => {
          renderList(latestSongs, input.value.trim().toLowerCase());
        }, 120);
        input.addEventListener("input", onSearch);
      }

      async function load() {
        const { data: playlist, error } = await client
          .from("playlists")
          .select("id,name,deleted")
          .eq("id", id)
          .eq("deleted", false)
          .maybeSingle();

        if (error || !playlist) {
          content.className = "error";
          content.textContent = "Playlist not found. Cloud playlists can be opened here after the owner signs in.";
          setShareMeta({
            title: "Playlist not found — Worship Companion",
            description: "This playlist link could not be opened.",
            url: location.href,
            type: "music.playlist",
          });
          return;
        }
        const { data: entries } = await client
          .from("playlist_songs")
          .select("song_id,category,added_at")
          .eq("playlist_id", id)
          .order("added_at", { ascending: true });

        latestSongs = await fetchSongsFor(entries || []);
        playlistName = playlist.name || "Playlist";

        setShareMeta({
          title: playlistName + " — Worship Companion",
          description:
            latestSongs.length +
            " song" +
            (latestSongs.length === 1 ? "" : "s") +
            " · Shared playlist from Worship Companion",
          url: location.href,
          type: "music.playlist",
        });

        content.className = "";
        content.innerHTML = `
          <div class="song-hero">
            <div class="song-badges">
              <span class="pill-badge accent">Shared Playlist</span>
            </div>
            <h1 class="song-title">${escapeHtml(playlistName)}</h1>
            <div class="meta-row">
              <div class="meta" id="songCount">${latestSongs.length} song${latestSongs.length === 1 ? "" : "s"}</div>
              <div class="toolbar-group">
                <button type="button" class="btn tonal share-qr-btn" id="sharePlaylistQrBtn">
                  <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-5 0h3v5h-3v-5zm2 5h3v3h-3v-3zm3-2h3v5h-3v-5z"/></svg>
                  <span>Share QR</span>
                </button>
                <button type="button" class="btn tonal" id="themeToggle" aria-label="Toggle theme">
                  <span>Theme</span>
                </button>
              </div>
            </div>
          </div>

          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              id="playlistSearch"
              class="search-input"
              type="search"
              placeholder="Search songs or authors"
              autocomplete="off"
              enterkeyhint="search"
              aria-label="Search songs or authors"
            />
          </div>

          <div class="list" id="songList"></div>
          <div class="empty-filter" id="emptyFilter" hidden>No songs match that search.</div>
        `;

        updateThemeIcon();
        wireSearch();
        renderList(latestSongs, "");

        // Wire Share QR button
        document.getElementById("sharePlaylistQrBtn")?.addEventListener("click", () => {
          openShareQrModal({
            title: "Share Playlist",
            subtitle: "Anyone can scan this code to open on their phone",
            url: location.href,
            caption: playlistName,
            detail: `${latestSongs.length} song${latestSongs.length === 1 ? "" : "s"}`,
          });
        });

        // Wire Theme toggle
        document.getElementById("themeToggle")?.addEventListener("click", () => {
          lightTheme = !lightTheme;
          if (lightTheme) {
            root.setAttribute("data-theme", "light");
            localStorage.setItem("wc_web_theme", "light");
          } else {
            root.removeAttribute("data-theme");
            localStorage.setItem("wc_web_theme", "dark");
          }
          updateThemeIcon();
        });
      }

      const debouncedLoad = debounce(load, 400);

      function startLive() {
        channels = [
          subscribeFiltered(client, "pl-" + id, "playlists", "id=eq." + id, debouncedLoad),
          subscribeFiltered(client, "pls-" + id, "playlist_songs", "playlist_id=eq." + id, debouncedLoad),
        ];
      }

      load();
      startLive();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          channels.forEach((ch) => client.removeChannel(ch));
          channels = [];
        } else {
          load();
          startLive();
        }
      });
    }
  </script>
</body>
</html>
