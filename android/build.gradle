buildscript {
    ext.kotlin_version = '2.4.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

def enable16KbNativeAlignment = { Project p ->
    def androidExt = p.extensions.findByName("android")
    if (androidExt == null) {
        return
    }
    androidExt.ndkVersion = "28.2.13676358"
    try {
        def cmake = androidExt.defaultConfig.externalNativeBuild.cmake
        def args = cmake.arguments
        if (!args.contains("-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON")) {
            args.add("-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON")
        }
        def linker = "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
        if (!args.contains(linker)) {
            args.add(linker)
        }
    } catch (Exception ignored) {
        // Module has no CMake native build.
    }
}

// Force every Android module (including plugins like inditrans) onto NDK r28
// so shared libraries are built with 16 KB page-size alignment.
subprojects { subproject ->
    if (subproject.state.executed) {
        enable16KbNativeAlignment(subproject)
    } else {
        subproject.afterEvaluate {
            enable16KbNativeAlignment(subproject)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
